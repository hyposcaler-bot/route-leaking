set / interface ethernet-1/1 description "client1::eth1"
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 vlan-tagging true
set / interface ethernet-1/1 subinterface 10 type bridged
set / interface ethernet-1/1 subinterface 10 admin-state enable
set / interface ethernet-1/1 subinterface 10 vlan encap untagged

set / interface ethernet-1/2 description "client2::eth1"
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 vlan-tagging true
set / interface ethernet-1/2 subinterface 20 type bridged
set / interface ethernet-1/2 subinterface 20 admin-state enable
set / interface ethernet-1/2 subinterface 20 vlan encap untagged

set / interface ethernet-1/3 description "spine1::ethernet-1/1"
set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 address 10.0.1.0/31

set / interface irb0 subinterface 10 ipv4 admin-state enable
set / interface irb0 subinterface 10 ipv4 address 10.255.10.1/24 anycast-gw true
set / interface irb0 subinterface 10 ipv4 address 10.255.10.1/24 primary
set / interface irb0 subinterface 10 ipv4 arp proxy-arp true
set / interface irb0 subinterface 10 ipv4 arp evpn advertise dynamic
set / interface irb0 subinterface 10 anycast-gw

set / interface irb0 subinterface 20 ipv4 admin-state enable
set / interface irb0 subinterface 20 ipv4 address 10.255.20.1/24 anycast-gw true
set / interface irb0 subinterface 20 ipv4 address 10.255.20.1/24 primary
set / interface irb0 subinterface 20 ipv4 arp proxy-arp true
set / interface irb0 subinterface 20 ipv4 arp evpn advertise dynamic
set / interface irb0 subinterface 20 anycast-gw

set / interface system0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.255.255.1/32

set / network-instance bridge-10 type mac-vrf
set / network-instance bridge-10 admin-state enable
set / network-instance bridge-10 interface ethernet-1/1.10
set / network-instance bridge-10 interface irb0.10
set / network-instance bridge-10 bridge-table mac-learning admin-state enable

set / network-instance bridge-20 type mac-vrf
set / network-instance bridge-20 admin-state enable
set / network-instance bridge-20 interface ethernet-1/2.20
set / network-instance bridge-20 interface irb0.20
set / network-instance bridge-20 bridge-table mac-learning admin-state enable

set / network-instance l3vpn-20-40 type ip-vrf
set / network-instance l3vpn-20-40 admin-state enable
set / network-instance l3vpn-20-40 interface irb0.20

set / network-instance l3vpn-10-30 type ip-vrf
set / network-instance l3vpn-10-30 admin-state enable
set / network-instance l3vpn-10-30 interface irb0.10

set / network-instance default type default
set / network-instance default admin-state enable
set / network-instance default router-id 10.255.255.1
set / network-instance default interface ethernet-1/3.0
set / network-instance default interface system0.0
set / network-instance default protocols bgp autonomous-system 65010
set / network-instance default protocols bgp router-id 10.255.255.1
set / network-instance default protocols bgp afi-safi evpn admin-state enable
set / network-instance default protocols bgp afi-safi evpn evpn inter-as-vpn true
set / network-instance default protocols bgp afi-safi evpn send-community-type [ standard extended large ]
set / network-instance default protocols bgp afi-safi evpn evpn rapid-update true
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp afi-safi ipv4-unicast send-community-type [ standard extended large ]

set / network-instance default protocols bgp group spine peer-as 65100
set / network-instance default protocols bgp group spine transport local-address 10.0.1.0
set / network-instance default protocols bgp group spine export-policy [ open ]
set / network-instance default protocols bgp group spine import-policy [ open ]

set / network-instance default protocols bgp neighbor 10.0.1.1 description "spine1::ethernet-1/1"
set / network-instance default protocols bgp neighbor 10.0.1.1 peer-group spine

set / routing-policy policy open default-action policy-result accept

set network-instance l3vpn-10-30 inter-instance-policies apply-policy export-policy open import-policy open
set network-instance l3vpn-20-40 inter-instance-policies apply-policy export-policy open import-policy open