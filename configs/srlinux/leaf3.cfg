set / interface ethernet-1/1 description "client5::eth1"
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 vlan-tagging true
set / interface ethernet-1/1 subinterface 50 type bridged
set / interface ethernet-1/1 subinterface 50 admin-state enable
set / interface ethernet-1/1 subinterface 50 vlan encap untagged

set / interface ethernet-1/3 description "spine1::ethernet-1/3"
set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 address 10.0.3.0/31

set / interface irb0 subinterface 50 ipv4 admin-state enable
set / interface irb0 subinterface 50 ipv4 address 10.255.50.1/24 anycast-gw true
set / interface irb0 subinterface 50 ipv4 address 10.255.50.1/24 primary
set / interface irb0 subinterface 50 ipv4 arp proxy-arp true
set / interface irb0 subinterface 50 ipv4 arp evpn advertise dynamic
set / interface irb0 subinterface 50 anycast-gw

set / interface system0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.255.255.3/32

set / tunnel-interface vxlan1 vxlan-interface 50 type bridged
set / tunnel-interface vxlan1 vxlan-interface 50 ingress vni 100050

set / tunnel-interface vxlan1 vxlan-interface 1003 type routed
set / tunnel-interface vxlan1 vxlan-interface 1003 ingress vni 101003

set / network-instance bridge-50 type mac-vrf
set / network-instance bridge-50 admin-state enable
set / network-instance bridge-50 interface ethernet-1/1.50
set / network-instance bridge-50 interface irb0.50
set / network-instance bridge-50 vxlan-interface vxlan1.50
set / network-instance bridge-50 protocols bgp-evpn bgp-instance 1 encapsulation-type vxlan
set / network-instance bridge-50 protocols bgp-evpn bgp-instance 1 vxlan-interface vxlan1.50
set / network-instance bridge-50 protocols bgp-evpn bgp-instance 1 evi 50
set / network-instance bridge-50 protocols bgp-evpn bgp-instance 1 routes bridge-table vlan-aware-bundle-eth-tag 50
set / network-instance bridge-50 protocols bgp-evpn bgp-instance 1 routes bridge-table mac-ip advertise true
set / network-instance bridge-50 protocols bgp-vpn bgp-instance 1 route-target export-rt target:65000:1050
set / network-instance bridge-50 protocols bgp-vpn bgp-instance 1 route-target import-rt target:65000:1050
set / network-instance bridge-50 bridge-table mac-learning admin-state enable

set / network-instance l3vpn-hub type ip-vrf
set / network-instance l3vpn-hub admin-state enable
set / network-instance l3vpn-hub interface irb0.50
set / network-instance l3vpn-hub vxlan-interface vxlan1.1003
set / network-instance l3vpn-hub protocols bgp-evpn bgp-instance 1 admin-state enable
set / network-instance l3vpn-hub protocols bgp-evpn bgp-instance 1 vxlan-interface vxlan1.1003
set / network-instance l3vpn-hub protocols bgp-evpn bgp-instance 1 evi 1003
set / network-instance l3vpn-hub protocols bgp-vpn bgp-instance 1 route-target export-rt target:65000:1003
set / network-instance l3vpn-hub protocols bgp-vpn bgp-instance 1 route-target import-rt target:65000:1003

set / network-instance default type default
set / network-instance default admin-state enable
set / network-instance default router-id 10.255.255.3
set / network-instance default interface ethernet-1/3.0
set / network-instance default interface system0.0
set / network-instance default protocols bgp autonomous-system 65030
set / network-instance default protocols bgp router-id 10.255.255.3
set / network-instance default protocols bgp afi-safi evpn admin-state enable
set / network-instance default protocols bgp afi-safi evpn send-community-type [ standard extended large ]
set / network-instance default protocols bgp afi-safi evpn evpn rapid-update true
set / network-instance default protocols bgp afi-safi evpn evpn inter-as-vpn true
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp afi-safi ipv4-unicast send-community-type [ standard extended large ]

set / network-instance default protocols bgp group spine peer-as 65100
set / network-instance default protocols bgp group spine transport local-address 10.0.3.0
set / network-instance default protocols bgp group spine export-policy [ open ]
set / network-instance default protocols bgp group spine import-policy [ open ]

set / network-instance default protocols bgp neighbor 10.0.3.1 description "spine1::ethernet-1/3"
set / network-instance default protocols bgp neighbor 10.0.3.1 peer-group spine

set / routing-policy policy open default-action policy-result accept

