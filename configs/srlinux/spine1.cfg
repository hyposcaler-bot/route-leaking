set / interface ethernet-1/1 description "leaf1::ethernet-1/3"
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.0.1.1/31

set / interface ethernet-1/2 description "leaf2::ethernet-1/3"
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 10.0.2.1/31

set / interface ethernet-1/3 description "leaf3::ethernet-1/3"
set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 address 10.0.3.1/31

set / interface system0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.255.255.10/32

set / network-instance default type default
set / network-instance default admin-state enable
set / network-instance default router-id 10.255.255.10
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default interface ethernet-1/3.0
set / network-instance default interface system0.0
set / network-instance default protocols bgp autonomous-system 65100
set / network-instance default protocols bgp router-id 10.255.255.10
set / network-instance default protocols bgp afi-safi evpn admin-state enable
set / network-instance default protocols bgp afi-safi evpn send-community-type [ standard extended large ]
set / network-instance default protocols bgp afi-safi evpn evpn rapid-update true
set / network-instance default protocols bgp afi-safi evpn evpn inter-as-vpn true
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp afi-safi ipv4-unicast send-community-type [ standard extended large ]

set / network-instance default protocols bgp group leaf export-policy [ open ]
set / network-instance default protocols bgp group leaf import-policy [ open ]

set / network-instance default protocols bgp neighbor 10.0.1.0 transport local-address 10.0.1.1
set / network-instance default protocols bgp neighbor 10.0.1.0 peer-as 65010
set / network-instance default protocols bgp neighbor 10.0.1.0 description "leaf1::ethernet-1/3"
set / network-instance default protocols bgp neighbor 10.0.1.0 peer-group leaf

set / network-instance default protocols bgp neighbor 10.0.2.0 transport local-address 10.0.2.1
set / network-instance default protocols bgp neighbor 10.0.2.0 peer-as 65020
set / network-instance default protocols bgp neighbor 10.0.2.0 description "leaf2::ethernet-1/3"
set / network-instance default protocols bgp neighbor 10.0.2.0 peer-group leaf

set / network-instance default protocols bgp neighbor 10.0.3.0 transport local-address 10.0.3.1
set / network-instance default protocols bgp neighbor 10.0.3.0 peer-as 65030
set / network-instance default protocols bgp neighbor 10.0.3.0 description "leaf3::ethernet-1/3"
set / network-instance default protocols bgp neighbor 10.0.3.0 peer-group leaf

set / routing-policy policy open default-action policy-result accept

